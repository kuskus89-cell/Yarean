<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://accounts.google.com/gsi/client"async defer></script>
</head>
<body class="Login page">
    <div class="form-container">
        <h2>Login</h2>
        <form id="loginForm">
            <div class="input-box">
                <input type="email" id="email" required placeholder="">
                <span>Email</span>
            </div>
        
        <div class="input-box">
            <input type="password" id="password" required placeholder="">
            <span>Password</span>
            <p class="forgot" id="forgotPassword">Forgot Password?</p>
         </div>
         <button type="submit" class="submit-btn">Login</button>
         <p style="font-size: 16px; color:white;">Don't have an account?</p>
          <div id="g_id_onload" data-client_id="20063597605-06214gkv3drfp7mjei4ucvcheevqg3ar.apps.googleusercontent.com"
          
    data-callback="handleGoogleLogin"></div>
    <div class="g_id_signin"></div>
         <p id="message"></p>
    </div>
    <script src="login.js"></script>
</body>
<div id="resetModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2>Reset Password</h2>
            <div class="input-box">
                <input type="email" id="resetEmail" required placeholder="Enter your email">
                <span>Email</span>
            </div>
            <button type="submit" class="submit-btn">Send Reset Link</button>
    </div>
</div>
</html>
